<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  
  <!-- Fedora hat -->
  <ellipse cx="50" cy="35" rx="32" ry="6" fill="#2a2a2a"/>
  <path d="M 25 35 Q 25 25 50 25 Q 75 25 75 35 L 75 45 Q 75 50 50 50 Q 25 50 25 45 Z" fill="#3a3a3a"/>
  <ellipse cx="50" cy="45" rx="25" ry="5" fill="#2a2a2a"/>
  
  <!-- Hat band -->
  <rect x="25" y="42" width="50" height="4" fill="#8b0000" rx="1"/>
  
  <!-- Gun silhouette -->
  <g transform="translate(30, 55)">
    <!-- Gun barrel -->
    <rect x="0" y="8" width="25" height="6" fill="#4a4a4a" rx="1"/>
    <!-- Gun handle -->
    <path d="M 25 8 L 32 8 L 35 14 L 35 20 L 30 22 L 25 20 Z" fill="#4a4a4a"/>
    <!-- Trigger guard -->
    <path d="M 25 14 Q 28 14 28 17 Q 28 20 25 20" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  </g>
  
  <!-- Decorative elements - playing cards -->
  <g transform="translate(70, 65) rotate(15)">
    <rect x="0" y="0" width="8" height="11" fill="#fff" stroke="#333" stroke-width="0.5" rx="0.5"/>
    <text x="4" y="7" font-size="6" fill="#8b0000" text-anchor="middle" font-weight="bold">A</text>
  </g>
  
  <g transform="translate(75, 70) rotate(-10)">
    <rect x="0" y="0" width="8" height="11" fill="#fff" stroke="#333" stroke-width="0.5" rx="0.5"/>
    <text x="4" y="7" font-size="6" fill="#000" text-anchor="middle" font-weight="bold">K</text>
  </g>
</svg>
