services:
  backend:
    build:
      context: ./Mafia
      dockerfile: Dockerfile
    container_name: mafia-backend
    ports:
      - "5141:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - mafia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./mafia_fe
      dockerfile: Dockerfile
    container_name: mafia-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5141
    depends_on:
      backend:
        condition: service_started
    networks:
      - mafia-network
    restart: unless-stopped

networks:
  mafia-network:
    driver: bridge
