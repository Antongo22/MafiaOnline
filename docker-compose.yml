services:
  backend:
    build:
      context: ./Mafia
      dockerfile: Dockerfile
    container_name: mafia-backend
    # Порт не пробрасывается наружу - доступ только через nginx (frontend)
    # ports:
    #   - "5141:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - CALLS_API_URL=${CALLS_API_URL:-https://calls.trexon.ru/}
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
    networks:
      - mafia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./mafia_fe
      dockerfile: Dockerfile
    container_name: mafia-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5141
    depends_on:
      backend:
        condition: service_started
    networks:
      - mafia-network
    restart: unless-stopped

networks:
  mafia-network:
    driver: bridge
